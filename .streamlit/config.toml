# Configuração do Streamlit para quem usa a aplicação (lida a partir da raiz do projeto).

[client]
# Esconde do menu as opções de desenvolvedor (Deploy, Rerun, configurações).
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
# Tema escuro fixo (o gráfico usa o passo de azul do tema escuro).
base = "dark"
# Mesmo azul dos gráficos.
primaryColor = "#3987e5"
