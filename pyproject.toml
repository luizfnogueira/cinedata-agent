[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinedata-agent"
version = "0.1.0"
description = "Agente Text-to-SQL sobre a camada Gold da CineData Analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai-slim[openai]>=2.52",
    "pydantic-settings>=2.15",
    "sqlglot>=30.0",
    "streamlit>=1.64",
]

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Aviso interno do pydantic_graph (dependência do PydanticAI), não do nosso código
    "ignore:There is no current event loop:DeprecationWarning:pydantic_graph",
]
