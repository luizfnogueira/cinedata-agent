# Casos de avaliação do agente: pergunta + SQL de referência ("gabarito").
#
# O avaliador roda a pergunta no agente, pega o resultado da última consulta
# bem-sucedida dele e compara com o resultado do SQL de referência.
#
# Campos:
#   id, categoria, pergunta    obrigatórios
#   sql                        SQL de referência (omitido nos casos de recusa)
#   tipo                       "consulta" (padrão) ou "recusa" (o agente não deve executar SQL nenhum)
#   colunas                    colunas do gabarito a comparar (padrão: todas)
#   ordenado                   a ordem das linhas importa (rankings)
#   ordem_por                  coluna do gabarito que define a ordem; linhas empatadas nela
#                              podem vir em qualquer ordem, e o último bloco de empate pode
#                              ter qualquer filme com o mesmo valor (o LIMIT corta o empate)
#   apenas_primeira            compara só a primeira linha (perguntas de "qual é o maior")
#   contem                     textos que precisam aparecer na resposta (sem diferenciar acentos)
#
# As regras de negócio dos gabaritos são as mesmas do system prompt (ver prompts.py).
# Onde a atividade não diz quantos itens listar, a pergunta fixa o número, para que
# exista uma resposta certa.

# ── Bilheteria e Finanças ───────────────────────────────────────────────

[[casos]]
id = "fin-01"
categoria = "Bilheteria e Finanças"
pergunta = "Quais são os 10 filmes com maior receita em R$?"
colunas = ["titulo", "receita_brl"]
ordenado = true
ordem_por = "receita_brl"
contem = ["Avatar: The Way Of Water"]
sql = """
SELECT titulo, ano_lancamento, receita_brl
FROM vw_filmes
WHERE receita_brl IS NOT NULL
ORDER BY receita_brl DESC
LIMIT 10
"""

[[casos]]
id = "fin-02"
categoria = "Bilheteria e Finanças"
pergunta = "Qual o lucro médio por gênero, considerando apenas filmes com receita informada?"
colunas = ["genero", "lucro_medio_brl"]
sql = """
SELECT g.genero, AVG(f.lucro_brl) AS lucro_medio_brl
FROM vw_filmes f
JOIN vw_filme_genero g ON g.sk_movie_id = f.sk_movie_id
WHERE f.lucro_brl IS NOT NULL
GROUP BY g.genero
"""

[[casos]]
id = "fin-03"
categoria = "Bilheteria e Finanças"
pergunta = "Quais são os 10 filmes com maior margem de lucro, entre os que possuem receita e orçamento informados?"
colunas = ["titulo", "margem_lucro"]
ordenado = true
ordem_por = "margem_lucro"
sql = """
SELECT titulo, ano_lancamento, margem_lucro
FROM vw_filmes
WHERE margem_lucro IS NOT NULL
ORDER BY margem_lucro DESC
LIMIT 10
"""

# ── Popularidade e Engajamento ──────────────────────────────────────────

[[casos]]
id = "pop-01"
categoria = "Popularidade e Engajamento"
pergunta = "Quais são os 5 filmes mais populares?"
colunas = ["titulo", "popularidade"]
ordenado = true
ordem_por = "popularidade"
contem = ["Blue Beetle"]
sql = """
SELECT titulo, ano_lancamento, popularidade
FROM vw_filmes
WHERE popularidade IS NOT NULL
ORDER BY popularidade DESC
LIMIT 5
"""

[[casos]]
id = "pop-02"
categoria = "Popularidade e Engajamento"
pergunta = "Quais são os 10 filmes com maior divergência entre a nota TMDB e a nota IMDb?"
colunas = ["titulo"]
ordenado = true
ordem_por = "divergencia"
sql = """
SELECT titulo, ano_lancamento, nota_tmdb, nota_imdb, ABS(nota_tmdb - nota_imdb) AS divergencia
FROM vw_filmes
WHERE qtd_tmdb >= 50 AND qtd_imdb >= 50 AND nota_tmdb IS NOT NULL AND nota_imdb IS NOT NULL
ORDER BY divergencia DESC
LIMIT 10
"""

[[casos]]
id = "pop-03"
categoria = "Popularidade e Engajamento"
pergunta = "Qual a nota média IMDb por ano de lançamento?"
colunas = ["ano_lancamento", "nota_media_imdb"]
sql = """
SELECT ano_lancamento, AVG(nota_imdb) AS nota_media_imdb
FROM vw_filmes
WHERE nota_imdb IS NOT NULL
GROUP BY ano_lancamento
"""

# ── Elenco e Equipe ─────────────────────────────────────────────────────

[[casos]]
id = "ele-01"
categoria = "Elenco e Equipe"
pergunta = "Qual ator teve mais participações em filmes lançados nos últimos 5 anos?"
colunas = ["nome_pessoa", "qtd_filmes"]
apenas_primeira = true
contem = ["Eric Roberts"]
sql = """
SELECT p.nome_pessoa, COUNT(*) AS qtd_filmes
FROM vw_filme_pessoa p
JOIN vw_filmes f ON f.sk_movie_id = p.sk_movie_id
WHERE p.tipo_pessoa = 'Ator' AND f.lancado = 1 AND f.ano_lancamento BETWEEN 2020 AND 2024
GROUP BY p.sk_person_id, p.nome_pessoa
ORDER BY qtd_filmes DESC
LIMIT 1
"""

[[casos]]
id = "ele-02"
categoria = "Elenco e Equipe"
pergunta = "Quais são os 10 diretores com maior nota média, considerando apenas quem tem pelo menos 5 filmes?"
colunas = ["nome_pessoa", "nota_media"]
ordenado = true
ordem_por = "nota_media"
sql = """
SELECT p.nome_pessoa, AVG(f.nota_imdb) AS nota_media, COUNT(*) AS qtd_filmes
FROM vw_filme_pessoa p
JOIN vw_filmes f ON f.sk_movie_id = p.sk_movie_id
WHERE p.tipo_pessoa = 'Diretor' AND f.nota_imdb IS NOT NULL AND f.qtd_imdb >= 50
GROUP BY p.sk_person_id, p.nome_pessoa
HAVING COUNT(*) >= 5
ORDER BY nota_media DESC
LIMIT 10
"""

[[casos]]
id = "ele-03"
categoria = "Elenco e Equipe"
pergunta = "Qual a dupla ator–diretor que mais trabalhou junta?"
colunas = ["ator", "diretor", "qtd_filmes"]
apenas_primeira = true
contem = ["Joe Anoa'i", "Kevin Dunn"]
sql = """
SELECT a.nome_pessoa AS ator, d.nome_pessoa AS diretor, COUNT(*) AS qtd_filmes
FROM vw_filme_pessoa a
JOIN vw_filme_pessoa d ON d.sk_movie_id = a.sk_movie_id AND d.tipo_pessoa = 'Diretor'
WHERE a.tipo_pessoa = 'Ator' AND a.nome_pessoa <> d.nome_pessoa
GROUP BY a.sk_person_id, d.sk_person_id
ORDER BY qtd_filmes DESC
LIMIT 1
"""

# ── Gêneros e Produtoras ────────────────────────────────────────────────

[[casos]]
id = "gen-01"
categoria = "Gêneros e Produtoras"
pergunta = "Qual a quantidade de filmes por gênero?"
colunas = ["genero", "qtd_filmes"]
sql = """
SELECT genero, COUNT(*) AS qtd_filmes
FROM vw_filme_genero
GROUP BY genero
"""

[[casos]]
id = "gen-02"
categoria = "Gêneros e Produtoras"
pergunta = "Qual produtora teve o maior lucro total?"
# Só o nome: somar em R$ ou em US$ muda o valor, mas não a produtora.
colunas = ["nome_produtora"]
apenas_primeira = true
contem = ["Marvel Studios"]
sql = """
SELECT c.nome_produtora, SUM(f.lucro_brl) AS lucro_total_brl
FROM vw_filmes f
JOIN vw_filme_produtora c ON c.sk_movie_id = f.sk_movie_id
WHERE f.lucro_brl IS NOT NULL
GROUP BY c.sk_company_id, c.nome_produtora
ORDER BY lucro_total_brl DESC
LIMIT 1
"""

[[casos]]
id = "gen-03"
categoria = "Gêneros e Produtoras"
pergunta = "Qual gênero tem a maior margem de lucro média?"
colunas = ["genero"]
apenas_primeira = true
contem = ["Terror"]
sql = """
SELECT g.genero, SUM(f.lucro_usd) * 1.0 / SUM(f.receita_usd) AS margem_agregada, COUNT(*) AS qtd_filmes
FROM vw_filmes f
JOIN vw_filme_genero g ON g.sk_movie_id = f.sk_movie_id
WHERE f.margem_lucro IS NOT NULL
GROUP BY g.genero
HAVING COUNT(*) >= 10
ORDER BY margem_agregada DESC
LIMIT 1
"""

